name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Installer Python pour Semgrep
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Installer Semgrep
        run: python -m pip install "semgrep==1.182.1"
      - name: Bloquer les nouvelles vulnérabilités
        run: |
          semgrep scan \
            --config p/java \
            --metrics=off \
            --jobs 2 \
            --strict \
            --baseline-commit 87ddf8c69ecfc276d5824e092083bbc10697d2d7 \
            --error \
            tika-core \
            tika-serialization \
            tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module \
            tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-pdf-module \
            tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
